# agentd configuration reference
# Copy to ~/.agentd/config.yaml or pass via: agentd --config <path>

# Filesystem layout (usually derived from --home).
home: ~/.agentd
db_path: ~/.agentd/global.db
projects_dir: ~/.agentd/projects
uploads_dir: ~/.agentd/uploads

# HTTP API.
api:
  address: "127.0.0.1:8765"
  # When non-empty, POST /api/v1/projects/materialize requires header
  # X-Agentd-Materialize-Token with this exact value (CLI `agentd ask` sends it automatically).
  materialize_token: ""

# AI gateway.
# Tool capability fallback: when a request includes tools but the selected provider
# does not support chat tools, the router clears tools and sets JSON mode (cascade
# only). An explicit profile Provider with unsupported tools returns an error.
# Role-mapped providers (role_models) use cascade-style fallback, not that error.
gateway:
  order: [openai, anthropic, ollama]
  max_tasks_per_phase: 7
  openai:
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    api_key: "" # or set OPENAI_API_KEY
    max_input_chars: 0 # 0 = use gateway.truncator.max_input_chars
    timeout: "5m"      # protect against slow LLM response (defaults to 5m)
  anthropic:
    base_url: "https://api.anthropic.com"
    model: "claude-3-haiku-20240307"
    api_key: "" # or set ANTHROPIC_API_KEY
    max_input_chars: 0
    timeout: "5m"      # protect against slow LLM response (defaults to 5m)
  ollama:
    base_url: "http://127.0.0.1:11434"
    model: "llama3:8b"
    max_input_chars: 0
    timeout: "5m"      # protect against slow local inference (defaults to 5m)
  llamacpp:
    base_url: "http://127.0.0.1:8080"
    model: "gpt-4"  # change this to match your GGUF model filename (e.g., "Qwen3.6-35B-A3B-APEX-I-Balanced.gguf")
    max_input_chars: 0
    timeout: "5m"   # protect against slow local inference
  horde:
    base_url: "https://aihorde.net/api"
    api_key: "0000000000"
    model: ""
    max_input_chars: 0
    timeout: "5m"
    poll_interval: "4s"
  budget:
    tokens_per_task: 50000 # per-task token cap; 0 = unlimited (Danger A)
  role_models:             # Flow 6.3: specialized model routing (wired via WithRoleRouting)
    chat:                  # high-reasoning model for planning/intent
      provider: ""         # empty = use default cascade order
      model: ""
    worker:                # fast coding model for task execution
      provider: ""
      model: ""
    memory:                # cheap model for summarization/curation
      provider: ""         # non-tool providers here still get JSON fallback when tools are sent
      model: ""
  truncator:
    policy: "head_tail" # head_tail | middle_out | summarize | reject
    max_input_chars: 12000
  truncation:
    strategy: "head_tail"
    head_ratio: 0.5
    max_input_chars: 12000
    stash_threshold: 50000
  # MCP (Model Context Protocol) capabilities - external tool servers
  # capabilities:
  #   - type: mcp
  #     name: "github"
  #     server_url: "https://api.example.com/mcp"
  #     auth:
  #       type: bearer
  #       token: "${MCP_TOKEN}"

# Per-tool rate limiting (PreToolUse).
# Keys are tool names; values are max invocations per session.
# The special "default" key applies to any tool without an explicit entry.
# 0 or absent = unlimited.
# Future extension: values may become objects with max_calls / window_seconds.
# Agentic worker mode (per AgentProfile.agentic_mode). Unsupported providers
# (see docs/provider-tool-calling.md) fall back to legacy JSON command execution.
agentic:
  # Fraction (0–1) of zone character budget that triggers preemptive summarization.
  # 0 disables the warning path. Default 0.85.
  context_warning_threshold: 0.85
  # Consecutive errors on the same tool before LoopToolFailure. 0 = fatal-only.
  tool_failure_streak: 3
  # Topic drift detection: opens a fresh in-task session when human input is unrelated.
  topic_guard:
    enabled: true
    # 0–1 sensitivity; higher values declare drift more readily. Default 0.5.
    sensitivity: 0.5
  tool_rate_limits:
    bash: 50
    default: 100
  # Credential mapping for tool handlers that call external APIs.
  # Keys are tool names; values are environment variable names holding the credential.
  # CredentialInjectionHook injects mapped env vars into the per-call execution
  # environment only; values are never exposed in tool arguments or model context.
  # CredentialValidationSessionHook checks at startup that every mapped env var is set.
  # CredentialDetectionHook scans tool arguments and vetoes calls that match
  # credential-like patterns; this can block execution even when tool_credentials
  # is configured. Do not place secrets in tool args.
  # disable_credential_detection: true  # opt out (not recommended; secrets may reach logs/context)
  # bash and delegate tools receive merged env in subprocess/sandbox paths.
  # MCP capability tools receive per-call auth via request context (Bearer from injected env).
  # tool_credentials:
  #   github: GITHUB_TOKEN
  #   jira: JIRA_API_KEY
  #   slack: SLACK_BOT_TOKEN

  # Approval gates for high-stakes tool calls.
  # Tools listed here require explicit human approval before execution.
  # The agent pauses and sends a structured approval request via a HUMAN subtask.
  approval_gates:
    enabled: false
    tools: []                    # e.g., ["deploy", "write_config", "run_migration"]
    timeout: "30m"               # max wait for human decision before timing out

  # Structured audit log (JSONL) for tool dispatches and turn-boundary snapshots.
  # Arguments are hashed (sha256); raw args are never written to the audit file.
  audit:
    enabled: false
    path: "audit.jsonl"          # relative to agentd home when not absolute

  # External tool names for prompt-injection resistance.
  # Results from these tools are wrapped in <external_content> tags so the
  # model treats them as untrusted data. When empty (default), all non-builtin
  # tools (i.e. any MCP / capability tool) are treated as external.
  # Explicitly listing names limits wrapping to only those tools.
  external_tools: []             # e.g., ["web_fetch", "read_url", "search"]

  # Review loop configuration.
  # When enabled on an agent profile, the agent sends its final output
  # for human review before marking the task complete.
  review:
    enabled: false               # default; override per-profile via AgentProfile.RequireReview

  # Skill-based contextual knowledge injection.
  # Skills are markdown documents loaded from the workspace or global directory
  # and injected into the system prompt when they match the current task.
  skills:
    threshold: 0.1          # minimum TF-IDF relevance score (0.0–1.0)
    top_k: 3                # max skills injected per session
    global_path: "skills"   # illustrative; see queue.skills.global_dir (relative to agentd home)

  # Smart file context pipeline for the read tool (convert → cache → embed → select).
  # PDF conversion requires pdftotext (poppler) on the worker host PATH.
  # Embeddings use the first OpenAI-compatible gateway provider.
  file_context:
    enabled: false
    top_k: 5
    cache_path: "file-cache"              # relative to agentd home
    embedding_model: "text-embedding-3-small"

  # Two-phase plan→execute for complex agentic tasks (Task 38).
  # complexity_threshold: 0 disables planning; e.g. 500 enables for long tasks.
  planning:
    complexity_threshold: 0
    max_redo_passes: 3
    plan_context_max_chars: 4000

  # Complexity-based model routing (Task 43). Routes unpinned agent profiles to
  # cheap/mid/high tiers from keyword scoring; context above threshold forces high.
  model_routing:
    enabled: false
    context_token_threshold: 150000
    cheap:
      provider: ""
      model: ""
    mid:
      provider: ""
      model: ""
    high:
      provider: ""
      model: ""

# Sandbox command execution hardening.
sandbox:
  inactivity_timeout: "60s"
  wall_timeout: "10m"
  kill_grace: "2s"
  max_log_bytes: 5242880
  env_allowlist: [PATH, HOME, LANG, LC_ALL, USER]
  extra_env: ["CI=true", "DEBIAN_FRONTEND=noninteractive", "NO_COLOR=1"]
  scrub_patterns: []
  limits:
    address_space_bytes: 2147483648
    cpu_seconds: 600
    open_files: 1024
    processes: 256

# Self-healing.
healing:
  enabled: true
  strategy: "increase_effort"
  steps: []
  max_adjustments: 0
  upgrade_model: ""
  upgrade_provider: ""
  context_multiplier: 2.0

# Circuit breaker.
breaker:
  handoff_after: "2m"

# Disk watchdog.
disk:
  free_threshold_percent: 10.0

# Channel-level security and validation.
# Enforced at dispatch before a claimed task reaches the worker loop.
#
# Upgrade note: agentd applies viper defaults even when this block is absent from
# ~/.agentd/config.yaml (max_message_size defaults to 1048576). That enables the
# channel gate on upgrade—structural validation plus a 1MB payload cap; rate_limit
# stays off unless you set it. Tasks with both empty title and description are
# rejected to FAILED at dispatch. To keep pre-upgrade behavior (no dispatch gate),
# set both max_message_size and rate_limit to 0 in your config.
channel:
  max_message_size: 1048576    # bytes; 0 = unlimited. Reject payloads above this threshold when > 0.
  rate_limit: 0                # max task admissions per task within rate_window (queue path keys session_id to task ID); 0 = unlimited. Dispatch-time validation runs when max_message_size > 0 and/or rate_limit > 0; set both to 0 to disable the channel gate.
  rate_window: 60              # sliding window (seconds) for per-session rate limiting.

# Background job schedules live in <home>/agentd.crontab (not this file).
# Example: @every 1m hitl-reconcile  — fail BLOCKED tasks past HITL deadline.

# Queue daemon.
queue:
  task_deadline: "10m"             # wall-clock timeout per worker task (the Reaper)
  queued_reconcile_after: "10m"    # min age before resetting stale QUEUED claims (orphan recovery); independent of task_deadline
  poll_max_interval: "10s"   # adaptive backoff ceiling when no tasks are available
  max_tool_iterations: 10    # max tool-call iterations per agentic task (0 = unlimited)
  token_budget: 0            # worker-level per-task token cap; 0 = unlimited (Danger A). See also gateway.budget.tokens_per_task.
  rolling_token_window: "5h" # sliding window for harness-wide token ledger
  rolling_token_limit: 0     # cumulative tokens in window before dispatch defers; 0 = disabled
  agentic_truncator_max: 30  # max messages after truncation in agentic mode
  agentic_character_budget: 0  # max characters for agentic truncation (0 = inherit gateway.truncator.max_input_chars)
  agentic_context:
    anchor_budget: 10000
    working_budget: 40000
    compressed_budget: 10000
    rolling_threshold_turns: 15
    keep_recent_turns: 5
  instructions:
    project_file: ".agentd/AGENTS.md"      # project-level instructions (relative to workspace)
    user_preferences_file: "prefs.yaml"   # user preferences (relative to ~/.agentd/)
  skills:
    project_dir: ".agentd/skills"        # project-scoped skills (relative to workspace)
    global_dir: "skills"                 # global skills dir: relative to agentd home (home / AGENTD_HOME); absolute or "~/..." also allowed
    threshold: 0.1                        # minimum TF-IDF relevance score (0.0-1.0)
    top_k: 3                            # max skills injected per session
  hitl:
    # Prompt/permission/healing/provider handoffs use this reconcile deadline.
    # Approval, review, and clarification handoffs use the 30m approval path instead.
    legacy_handoff_timeout: "168h"
  # Per-tool dispatch timeouts.
  # Keys are tool names; the special "default" key applies to unlisted tools.
  # Values are Go duration strings (e.g. "30s", "1m").
  tool_timeouts:
    bash: "60s"
    read: "10s"
    write: "10s"
    delegate: "10m"
    delegate_parallel: "10m"
    default: "30s"
  # Tool-level retry configuration.
  # Transient tool failures (timeouts, network errors) are retried transparently
  # with exponential backoff + jitter. The model never sees intermediate failures.
  # Only tools listed in tools are eligible; others are never retried.
  tool_retries:
    max_attempts: 3        # total attempts per tool call (1 = no retry)
    base_delay: "200ms"    # base delay between retries (Go duration string)
    max_delay: "5s"        # ceiling for exponential backoff (Go duration string)
    tools: ["read"]        # allowlisted tool names safe to retry

# Heartbeat reconciliation.
heartbeat:
  stale_after: "2m"

# Librarian log archival, memory curation, and recall.
librarian:
  retention_hours: 24              # completed task age before curation eligibility
  archive_grace_days: 7            # days to retain tar.gz archives after memory ingestion
  chunk_chars: 8000                # max chars per map-phase summarization chunk
  max_reduce_passes: 3             # recursive reduce rounds before concatenating
  fallback_head_tail_chars: 2000   # chars kept from head/tail in deterministic fallback
  recall_timeout: "500ms"          # hard timeout for memory recall (Danger B)
  recall_top_k: 5                  # max memories returned per recall
  preferences_top_k: 3             # max user preferences per recall
  dream_cluster_min_size: 3        # min cluster size for dream consolidation
  dream_similarity_threshold: 0.7  # Jaccard threshold for memory clustering

# Plugin infrastructure.
# Plugins are directories inside the configured path, each containing a
# manifest.json that declares hooks, capabilities, and env requirements.
# Load order is determined by numeric directory prefix (01-security/,
# 02-observability/, 10-code-quality/) or by the manifest "priority" field.
# A restart is required to pick up new or changed plugins.
plugins:
  enabled: false
  path: "~/.agentd/plugins"          # directory scanned for plugin sub-directories
  shell_hook_timeout: "3s"           # default timeout for shell-based hooks
