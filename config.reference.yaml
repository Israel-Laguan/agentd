# agentd configuration reference — copy to ~/.agentd/config.yaml or pass via: agentd --config <path>
# Precedence: CLI flags > --config file > AGENTD_* (incl. repo .env) > this file > defaults.
# When .env and config.yaml disagree, startup logs "config: key overridden by env"; use: agentd config show
# Extended documentation: docs/config-reference.md

home: ~/.agentd
db_path: ~/.agentd/global.db
projects_dir: ~/.agentd/projects
uploads_dir: ~/.agentd/uploads

api:
  address: "127.0.0.1:8765"
  materialize_token: "" # see docs/config-reference.md#api

gateway:
  order: [openai, anthropic, gemini, ollama]
  # See docs/config-reference.md#custom-provider-registry
  #
  # Example: two endpoints sharing the same adapter (OpenAI + Poolside in cascade).
  # This was impossible with the old per-vendor slot schema (Task 09).
  # providers:
  #   - name: openai
  #     adapter: openai
  #     base_url: "https://api.openai.com/v1"
  #     api_key_env: OPENAI_API_KEY
  #     model: "gpt-4o-mini"
  #   - name: poolside
  #     adapter: openai
  #     base_url: "https://inference.poolside.ai/v1"
  #     api_key_env: POOLSIDE_API_KEY
  #     model: "poolside/laguna-m.1"
  #     capabilities:
  #       chat_tools: true
  # order: [openai, poolside, anthropic, gemini, ollama]
  #
  # Single custom entry (e.g. vLLM alongside OpenAI):
  # providers:
  #   - name: vllm
  #     adapter: openai
  #     base_url: "http://127.0.0.1:8000/v1"
  #     model: "your-model-name"
  # order: [openai, vllm]
  warmup_enabled: true
  max_tasks_per_phase: 7
  openai:
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    api_key: ""
    max_input_chars: 0
    timeout: "5m"
  anthropic:
    base_url: "https://api.anthropic.com"
    model: "claude-3-haiku-20240307"
    api_key: ""
    max_input_chars: 0
    timeout: "5m"
  ollama:
    base_url: "http://127.0.0.1:11434"
    model: "llama3:8b"
    max_input_chars: 0
    timeout: "5m"
  llamacpp:
    base_url: "http://127.0.0.1:8080"
    model: "gpt-4"
    max_input_chars: 0
    timeout: "5m"
  horde:
    base_url: "https://aihorde.net/api"
    api_key: "0000000000"
    model: ""
    max_input_chars: 0
    timeout: "5m"
    poll_interval: "4s"  # legacy key — still supported; populates options.poll_interval
    # Preferred form (adapter-specific options):
    # options:
    #   poll_interval: "4s"
  gemini:
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    model: "gemini-2.5-flash"
    api_key: ""
    max_input_chars: 0
    timeout: "5m"
  budget:
    tokens_per_task: 50000
  # Role-level defaults when an agent profile leaves provider/model empty (see agentd init seeds).
  # Per-agent cascade uses gateway.order; role_models apply inside the router for chat/worker/memory roles.
  role_models:
    chat:
      provider: ""
      model: ""
    worker:
      provider: ""
      model: ""
    memory:
      provider: ""
      model: ""
  truncator:
    policy: "head_tail"
    max_input_chars: 12000
  truncation:
    strategy: "head_tail"
    head_ratio: 0.5
    max_input_chars: 12000
    stash_threshold: 50000
  # MCP external tool servers (formerly gateway.capabilities — renamed in Task 10)
  # mcp_servers:
  #   - name: my-mcp-server
  #     type: mcp
  #     server_url: "http://localhost:9000"

agentic:
  context_warning_threshold: 0.85
  tool_failure_streak: 3
  topic_guard:
    enabled: true
    sensitivity: 0.5
  tool_rate_limits:
    bash: 50
    default: 100
  approval_gates:
    enabled: false
    tools: []
    timeout: "30m"
  audit:
    enabled: false
    path: "audit.jsonl"
  external_tools: []
  review:
    enabled: false
  skills:
    threshold: 0.1
    top_k: 3
    global_path: "skills"
  file_context:
    enabled: false
    top_k: 5
    cache_path: "file-cache"
    embedding_model: "text-embedding-3-small"
  planning:
    complexity_threshold: 0
    max_redo_passes: 3
    plan_context_max_chars: 4000
  model_routing:
    enabled: false
    context_token_threshold: 150000
    cheap: {provider: "", model: ""}
    mid: {provider: "", model: ""}
    high: {provider: "", model: ""}
  tool_manifest:
    enabled: false
    min_confidence: 0.35
    mappings: {summarize: [], code_gen: [bash, read, write], doc_qa: [read], web_research: [read]}
  prompt_templates_path: "prompt_templates.json"
  scheduler: {enabled: false, tick_interval: "1m", project_id: "", tasks: []}
  batching:
    enabled: false
    max_batch_size: 5
  capability_routing:
    enabled: false
    min_confidence: 0.35
    mappings:
      generate_image: stability_api
      real_time_search: serper_api
      browse_url: browser_api
      spreadsheet_ops: sheets_api
    tools:
      generate_image: generate

sandbox:
  inactivity_timeout: "60s"
  wall_timeout: "10m"
  kill_grace: "2s"
  max_log_bytes: 5242880
  env_allowlist: [PATH, HOME, LANG, LC_ALL, USER]
  extra_env: ["CI=true", "DEBIAN_FRONTEND=noninteractive", "NO_COLOR=1"]
  scrub_patterns: []
  limits:
    address_space_bytes: 2147483648
    cpu_seconds: 600
    open_files: 1024
    processes: 256

healing:
  enabled: true
  strategy: "increase_effort"
  steps: []
  max_adjustments: 0
  upgrade_model: ""
  upgrade_provider: ""
  context_multiplier: 2.0

breaker:
  handoff_after: "2m"

disk:
  free_threshold_percent: 10.0

channel:
  max_message_size: 1048576
  rate_limit: 0
  rate_window: 60

queue:
  task_deadline: "10m"
  queued_reconcile_after: "10m"
  poll_max_interval: "10s"
  max_tool_iterations: 10
  token_budget: 0
  rolling_token_window: "5h"
  rolling_token_limit: 0
  agentic_truncator_max: 30
  agentic_character_budget: 0
  agentic_context:
    anchor_budget: 10000
    working_budget: 40000
    compressed_budget: 10000
    rolling_threshold_turns: 15
    keep_recent_turns: 5
  instructions:
    project_file: ".agentd/AGENTS.md"
    user_preferences_file: "prefs.yaml"
  skills:
    project_dir: ".agentd/skills"
    global_dir: "skills"
    threshold: 0.1
    top_k: 3
  hitl:
    legacy_handoff_timeout: "168h"
  tool_timeouts:
    bash: "60s"
    read: "10s"
    write: "10s"
    delegate: "10m"
    delegate_parallel: "10m"
    default: "30s"
  tool_retries:
    max_attempts: 3
    base_delay: "200ms"
    max_delay: "5s"
    tools: ["read"]

heartbeat:
  stale_after: "2m"

librarian:
  retention_hours: 24
  archive_grace_days: 7
  chunk_chars: 8000
  max_reduce_passes: 3
  fallback_head_tail_chars: 2000
  recall_timeout: "500ms"
  recall_top_k: 5
  preferences_top_k: 3
  dream_cluster_min_size: 3
  dream_similarity_threshold: 0.7

plugins:
  enabled: false
  path: "~/.agentd/plugins"
  shell_hook_timeout: "3s"
