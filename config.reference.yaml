home: ~/.agentd
db_path: ~/.agentd/global.db
projects_dir: ~/.agentd/projects
uploads_dir: ~/.agentd/uploads
log_level: info
api:
  address: "127.0.0.1:8765"
  materialize_token: "" # see docs/config-reference.md#api
  allowed_hosts: [] # extra Host values besides loopback; see docs/config-reference.md#api
  ui_origin: "http://localhost:3000" # web UI origin trusted for CORS and writes; "" trusts none
  source_root: "~" # materialize source_path must resolve under this; "" refuses all
gateway:
  order: [openai, anthropic, gemini, ollama]
  warmup_enabled: true
  max_tasks_per_phase: 7
  openai:
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    api_key: ""
    max_input_chars: 0
    timeout: "5m"
  anthropic:
    base_url: "https://api.anthropic.com"
    model: "claude-3-haiku-20240307"
    api_key: ""
    max_input_chars: 0
    timeout: "5m"
  ollama:
    base_url: "http://127.0.0.1:11434"
    model: "llama3:8b"
    max_input_chars: 0
    timeout: "5m"
  llamacpp:
    base_url: "http://127.0.0.1:8080"
    model: "gpt-4"
    max_input_chars: 0
    timeout: "5m"
  horde:
    base_url: "https://aihorde.net/api"
    api_key: "0000000000"
    model: ""
    max_input_chars: 0
    timeout: "5m"
    poll_interval: "4s"  # legacy key — still supported; populates options.poll_interval
  gemini:
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    model: ""
    api_key: ""
    max_input_chars: 0
    timeout: "5m"
  budget: # not implemented: parsed and ignored; use queue.token_budget
    tokens_per_task: 50000
  role_models:
    chat:
      provider: ""
      model: ""
    worker:
      provider: ""
      model: ""
    memory:
      provider: ""
      model: ""
  truncator:
    policy: "head_tail"
    max_input_chars: 12000
  truncation:
    strategy: "head_tail" # cuts agent and subagent context over budget: head_tail or middle_out
    head_ratio: 0.5 # head share for head_tail, here and in truncator.policy
    max_input_chars: 12000 # not implemented: parsed and ignored; use truncator.max_input_chars
    stash_threshold: 50000
agentic:
  context_warning_threshold: 0.85
  tool_failure_streak: 3
  topic_guard:
    enabled: true
    sensitivity: 0.5
  tool_rate_limits: # not implemented: no hook enforces these limits
    bash: 50
    default: 100
  approval_gates: # not implemented: AgentProfile.GatedTools is never set
    enabled: false
    tools: []
    timeout: "30m"
  audit:
    enabled: false
    path: "audit.jsonl"
  external_tools: []
  review: # not implemented: the review loop never runs
    enabled: false
  skills: # not implemented under agentic: skills are read from queue.skills
    threshold: 0.1
    top_k: 3
    global_path: "skills"
  file_context:
    enabled: false
    top_k: 5
    cache_path: "file-cache"
    embedding_model: "text-embedding-3-small"
  planning:
    complexity_threshold: 0
    max_redo_passes: 3
    plan_context_max_chars: 4000
  model_routing:
    enabled: false
    context_token_threshold: 150000
    cheap: {provider: "", model: ""}
    mid: {provider: "", model: ""}
    high: {provider: "", model: ""}
  tool_manifest:
    enabled: false
    min_confidence: 0.35
    mappings: {summarize: [], code_gen: [bash, read, write], doc_qa: [read], web_research: [read]}
  # Enabled schedulers need project_id (here or per task), or config load fails (B-076).
  scheduler: {enabled: false, tick_interval: "1m", project_id: "", tasks: []}
  batching:
    enabled: false
    max_batch_size: 5
  # No capability adapters exist yet (B-061, B-063): enabling this only logs a startup warning.
  capability_routing:
    enabled: false
    min_confidence: 0.35
    mappings:
      generate_image: stability_api
      real_time_search: serper_api
      browse_url: browser_api
      spreadsheet_ops: sheets_api
    tools:
      generate_image: generate
sandbox:
  backend: "auto"
  inactivity_timeout: "60s"
  wall_timeout: "10m"
  kill_grace: "2s"
  max_log_bytes: 5242880
  env_allowlist: [PATH, HOME, LANG, LC_ALL, USER]
  extra_env: ["CI=true", "DEBIAN_FRONTEND=noninteractive", "NO_COLOR=1"]
  scrub_patterns: []
  # Host directories bound read-only into the jail (e.g. ["/home/me/.local/go"]);
  # each one's bin/ (or the directory itself) goes first on the jail's PATH.
  toolchain_paths: []
  limits:
    address_space_bytes: 2147483648
    cpu_seconds: 600
    open_files: 1024
    processes: 256
healing:
  enabled: true
  strategy: "increase_effort"
  steps: []
  max_adjustments: 0
  upgrade_model: ""
  upgrade_provider: ""
  context_multiplier: 2.0
  max_healing_tasks: 0
  outage_handoff_enabled: true
breaker:
  handoff_after: "2m"
  open_timeout: "5m"
recovery:
  # Opt-in. At boot, empty a recovered task's project workspace before it re-runs.
  # Only projects created with start_empty_workspace (and no source_path) are reset;
  # others, and projects with another COMPLETED/RUNNING task, fail the recovered task.
  clean_workspace_on_recover: false
ai_usage:
  # Delete ai_calls and tool_calls rows older than this many days (checked at
  # start and every 6 hours). 0 keeps them forever.
  retention_days: 0
disk:
  free_threshold_percent: 10.0
channel:
  max_message_size: 1048576
  rate_limit: 0
  rate_window: 60
queue:
  task_deadline: "10m"
  queued_reconcile_after: "10m"
  poll_max_interval: "10s"
  max_tool_iterations: 10
  token_budget: 0
  rolling_token_window: "5h"
  rolling_token_limit: 0
  agentic_truncator_max: 30
  agentic_character_budget: 0
  agentic_context:
    anchor_budget: 10000
    working_budget: 40000
    compressed_budget: 10000
    rolling_threshold_turns: 15
    keep_recent_turns: 5
  instructions:
    project_file: ".agentd/AGENTS.md"
    user_preferences_file: "prefs.yaml"
  skills:
    project_dir: ".agentd/skills"
    global_dir: "skills"
    threshold: 0.1
    top_k: 3
  hitl:
    legacy_handoff_timeout: "168h"
  split:
    max_depth: 2
    max_subtasks: 5
  tool_timeouts:
    bash: "60s"
    read: "10s"
    write: "10s"
    delegate: "10m"
    delegate_parallel: "10m"
    default: "30s"
  tool_retries:
    max_attempts: 3
    base_delay: "200ms"
    max_delay: "5s"
    tools: ["read"]
heartbeat:
  stale_after: "2m"
librarian:
  retention_hours: 24
  archive_grace_days: 7
  chunk_chars: 8000
  max_reduce_passes: 3
  fallback_head_tail_chars: 2000
  recall_timeout: "500ms"
  recall_top_k: 5
  preferences_top_k: 3 # not implemented: parsed and ignored; saved preferences are always recalled in full
  dream_cluster_min_size: 3
  dream_similarity_threshold: 0.7
tiered:
  enabled: false
  complexity_threshold: 200
  context_pack:
    max_paths: 40
    max_chars: 48000
  escalation:
    max_mid_fix: 2
    max_escalate: 1
    max_re_gather: 2
mcp:
  enabled: false
  transport: stdio     # "stdio" (Claude Code/Cline), "http" (Streamable HTTP at /mcp), or "both"
  http_addr: "127.0.0.1:0"  # not implemented: parsed and ignored; the HTTP transport is served on api.address
plugins: # not implemented: nothing reads these keys; plugins are not loaded yet (B-063)
  enabled: false
  path: "~/.agentd/plugins"
  shell_hook_timeout: "3s"
