# LiteLLM proxy config for the agentd plan+execute scenario.
#
# agentd routes every LLM call to this proxy as the model "mock/agentd".
# The proxy forwards to the mock OpenAI-compatible backend (mockllm). This
# exercises the real litellm wire path without any live provider keys.
#
# Run with: litellm --config /app/config.yaml --host 0.0.0.0 --port 4000

general_settings:
  # Single shared key the agentd container must send (set LITELLM_API_KEY=sk-test).
  master_key: "sk-test"

model_list:
  - model_name: mock/agentd
    litellm_params:
      # openai/ prefix tells litellm to treat the upstream as OpenAI-compatible.
      model: openai/mock-agentd
      api_base: http://mockllm:8000/v1
      # Upstream mock does not auth; any non-empty key satisfies litellm.
      api_key: sk-mock
