# LiteLLM proxy config for the agentd plan+execute scenario.
#
# agentd routes every LLM call to this proxy as the model "agentd".
# The proxy forwards to the OpenAI-compatible backend (mockllm). This
# exercises the real litellm wire path without any live provider keys.
#
# Run with: litellm --config /app/config.yaml --host 0.0.0.0 --port 4000

general_settings:
  # DEMO-ONLY key for the isolated docker-plan-execute test network.
  # Never use a real secret here. The matching value is injected via
  # LITELLM_API_KEY in docker-compose for the agentd service.
  master_key: "sk-demo-litellm-plan-execute-only"

model_list:
  - model_name: agentd
    litellm_params:
      # openai/ prefix tells litellm to treat the upstream as OpenAI-compatible.
      model: openai/agentd
      api_base: http://mockllm:8000/v1
      # Upstream backend does not auth; any non-empty key satisfies litellm.
      api_key: sk-mock
