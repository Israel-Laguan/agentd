name: CI (PR size)

# Enforces the PR size rule from CONTRIBUTING.md: under 100 changed files and
# at most 1000 changed *source* lines (generated files excluded). A maintainer
# can add the `large-pr-ok` label to waive it for one PR; the label events
# re-run the check.
#
# Changed lines are computed from the real base..head diff (git diff --numstat),
# not GitHub's aggregated additions+deletions totals, so deletion-heavy PRs
# (dependency drops, lockfile regeneration) aren't punished one-for-one.
#
# Uses pull_request_target so the gate runs from trusted, base-controlled code:
# the counting + exclusion logic lives only in tools/ci/pr_size.sh, and the
# checkout fetches the PR head so that base..head can be diffed with git.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    name: PR size
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false
          # Full history: the gate diffs base..head, so the base commit must
          # exist locally. A shallow checkout leaves only the head commit and
          # git diff fails with "bad object <base_sha>".
          fetch-depth: 0

      - name: Check PR size
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_GIT: "1"
        run: bash tools/ci/pr_size.sh "$BASE_SHA" "$HEAD_SHA" "$LABELS"
