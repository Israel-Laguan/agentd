name: CI (PR size)

# Enforces the PR size rule from CONTRIBUTING.md: under 100 changed files and
# at most 1000 changed *source* lines (generated files excluded). A maintainer
# can add the `large-pr-ok` label to waive it for one PR; the label events
# re-run the check.
#
# Changed lines are computed from the real merge-base..head diff (git diff --numstat base...head),
# not GitHub's aggregated additions+deletions totals, so deletion-heavy PRs
# (dependency drops, lockfile regeneration) aren't punished one-for-one.
#
# Uses pull_request_target so the gate runs from trusted, base-controlled code:
# the counting + exclusion logic lives only in tools/ci/pr_size.sh. The checkout
# is the trusted base commit; the PR head (possibly from a fork) is fetched as
# Git data only and never checked out, so no PR-controlled code runs here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    name: PR size
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          # Full history, so the merge base of base and head can be found.
          fetch-depth: 0

      - name: Fetch the PR head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      - name: Check PR size
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_GIT: "1"
        run: bash tools/ci/pr_size.sh "$BASE_SHA" "$HEAD_SHA" "$LABELS"
