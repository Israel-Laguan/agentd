name: CI (Web)

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Enforce lint
        if: steps.lint.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed(
              'Web lint failed. Open the Lint step log for ESLint details.'
            );

      - name: Test
        id: test
        continue-on-error: true
        run: npm test -- --run

      - name: Enforce tests
        if: steps.test.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed(
              'Web tests failed. Open the Test step log for failure details.'
            );

      - name: Comment CI failure on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-web-failure -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body = `${marker}\n## CI (Web) failed\n\n[Workflow run](${runUrl})\n\n`;
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath && fs.existsSync(summaryPath)) {
              body += fs.readFileSync(summaryPath, 'utf8');
            } else {
              body += 'See the failed workflow run for details.';
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
