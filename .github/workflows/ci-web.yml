name: CI (Web)

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint

      - name: Report lint failure
        if: failure() && steps.lint.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        run: |
          ./scripts/ci_report_failure.sh "Web lint failed" \
            "ESLint reported issues. Open the Lint step log for details."

      - name: Test
        id: test
        run: npm test -- --run

      - name: Report test failure
        if: failure() && steps.test.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        run: |
          ./scripts/ci_report_failure.sh "Web tests failed" \
            "Tests failed. Open the Test step log for failure details."
