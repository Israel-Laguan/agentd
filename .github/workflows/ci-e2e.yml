name: CI (e2e journeys)

# The journey suite (test/e2e, `make test-e2e`) needs a podman stack and takes
# about five minutes of test time plus the image builds, so it is not part of
# the per-PR Go check. S07's exit gate ("all P0 journeys pass on two consecutive
# clean runs") used to rest on entries in docs/testing/results.md alone; this
# workflow is what re-runs it without a person (B-023).
#
# It also runs the Playwright UI smoke (web/e2e, SP-025): one real-browser test
# against the same stack, on the runner. The tier is seeded by the spike and
# only grows if the spike says go.
#
#
#   - weekly, on main;
#   - on demand (Actions > CI (e2e journeys) > Run workflow);
#   - on a pull request that touches the stack or the journeys themselves, so a
#     change to devenv/ or test/e2e/ is proven by the suite it changes.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "test/e2e/**"
      - "devenv/**"
      - ".github/workflows/ci-e2e.yml"

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The Makefile's podman compose gotchas (absolute -f path, every profile in
      # one invocation) are written against podman-compose 1.3.0. The runner image
      # also ships Docker's compose plugin, which `podman compose` prefers over
      # podman-compose and which then needs a Docker API socket that isn't there;
      # PODMAN_COMPOSE_PROVIDER pins the wrapper to the one we installed.
      - name: Install podman-compose
        run: |
          pipx install 'podman-compose==1.3.0'
          # The runner image sets PIPX_BIN_DIR=/opt/pipx_bin, so the binary is not
          # in ~/.local/bin; resolve wherever pipx actually put it.
          provider="$(command -v podman-compose)"
          echo "PODMAN_COMPOSE_PROVIDER=$provider" >> "$GITHUB_ENV"
          echo "using $provider"
          podman --version

      # SP-025: the browser runs on the runner, not in a container. The stack
      # publishes its ports on the runner host, and so does the web dev server,
      # so this is exactly how a developer reaches `make dev-up` locally.
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The Chromium build is pinned by the @playwright/test version in
      # web/package.json; hashing the lockfile invalidates the cache whenever
      # any web dependency changes, so a stale browser can never be reused.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # Host install must finish before `make test-e2e`: dev-up's web container
      # runs its own `npm ci` over the bind-mounted tree, and reinstalling
      # node_modules under a live dev server would be a race.
      - name: Install web deps and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Journeys (make test-e2e)
        run: make test-e2e

      # web has no healthcheck and dev-up does not wait for it; the Go suite
      # does not touch :3000, so readiness has to be asserted here.
      - name: Wait for the web UI
        run: |
          for _ in $(seq 1 60); do
            curl -sf --max-time 30 -o /dev/null http://localhost:3000 && exit 0
            sleep 2
          done
          echo "::error::the web UI never came up on http://localhost:3000"
          exit 1

      - name: UI smoke (Playwright)
        working-directory: web
        run: npx playwright test

      - name: Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: web/test-results/
          retention-days: 7

      - name: Stack state on failure
        if: failure()
        run: |
          podman ps -a --format '{{.Names}} {{.Status}}' || true
          for name in $(podman ps -a --format '{{.Names}}' | grep -E 'agentd|litellm|mockllm' || true); do
            echo "::group::logs $name"
            podman logs --tail 200 "$name" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: make dev-clean || true
