name: CI (Go)

on:
  # Run on push only for the default branch so feature-branch pushes do not
  # duplicate the pull_request check (same commit would report two "Go" statuses).
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".golangci.yml"
      - "scripts/**"
      - ".github/workflows/ci-go.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".golangci.yml"
      - "scripts/**"
      - ".github/workflows/ci-go.yml"

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GOLANGCI_LINT_VERSION: v2.11.4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify go.mod is tidy
        id: gomod_check
        continue-on-error: true
        run: ./scripts/verify_gomod.sh

      - name: Enforce go.mod tidy
        if: steps.gomod_check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let detail = 'go.mod not tidy. Run make tidy locally and commit go.mod and go.sum.';
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath && fs.existsSync(summaryPath)) {
              detail += '\n\nSee the job Summary tab for details.';
            }
            core.setFailed(detail);

      - name: Install golangci-lint
        if: always()
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}

      - name: LOC check
        if: always()
        id: loc_check
        continue-on-error: true
        run: make loc
        env:
          GITHUB_ACTIONS: true

      - name: Enforce LOC check
        if: always() && steps.loc_check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let detail = 'One or more files exceed LOC limits.';
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath && fs.existsSync(summaryPath)) {
              detail += '\n\nSee the job Summary tab for the file table.';
            }
            core.setFailed(detail);

      - name: Register golangci-lint problem matcher
        if: always()
        run: echo "::add-matcher::.github/golangci-lint-matcher.json"

      - name: Lint
        if: always()
        id: lint
        continue-on-error: true
        run: make lint

      - name: Remove golangci-lint problem matcher
        if: always()
        run: echo "::remove-matcher owner=golangci-lint::"

      - name: Enforce lint
        if: always() && steps.lint.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed(
              'golangci-lint failed. See file annotations and the Lint step log for details.'
            );

      - name: Test
        if: always()
        id: test
        continue-on-error: true
        run: make test

      - name: Enforce tests
        if: always() && steps.test.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed(
              'Go tests failed. Open the Test step log for package and assertion details.'
            );

      - name: Comment CI failure on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-go-failure -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body = `${marker}\n## CI (Go) failed\n\n[Workflow run](${runUrl})\n\n`;
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath && fs.existsSync(summaryPath)) {
              body += fs.readFileSync(summaryPath, 'utf8');
            } else {
              body += 'See the failed workflow run for details.';
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
