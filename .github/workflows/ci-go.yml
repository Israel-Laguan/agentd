name: CI (Go)

on:
  # Run on push only for the default branch so feature-branch pushes do not
  # duplicate the pull_request check (same commit would report two "Go" statuses).
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".golangci.yml"
      - "scripts/**"
      - "README.md"
      - "config.reference.yaml"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".markdownlint.json"
      - ".lychee.toml"
      - ".github/workflows/ci-go.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".golangci.yml"
      - "scripts/**"
      - "README.md"
      - "config.reference.yaml"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".markdownlint.json"
      - ".lychee.toml"
      - ".github/workflows/ci-go.yml"

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GOLANGCI_LINT_VERSION: v2.12.2
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        id: gomod_check
        continue-on-error: true
        run: ./scripts/verify_gomod.sh

      - name: Enforce go.mod tidy
        if: steps.gomod_check.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let detail = 'go.mod not tidy. Run make tidy locally and commit go.mod and go.sum.';
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath && fs.existsSync(summaryPath)) {
              detail += '\n\nSee the job Summary tab for details.';
            }
            core.setFailed(detail);

      - name: Install golangci-lint
        if: always()
        run: go install -v github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}

      - name: LOC check
        if: always()
        id: loc_check
        continue-on-error: true
        run: make loc
        env:
          GITHUB_ACTIONS: true

      - name: Enforce LOC check
        if: always() && steps.loc_check.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let detail = 'One or more files exceed LOC limits.';
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath && fs.existsSync(summaryPath)) {
              detail += '\n\nSee the job Summary tab for the file table.';
            }
            core.setFailed(detail);

      - name: Min function check
        if: always()
        id: minfunc_check
        continue-on-error: true
        run: make minfunc

      - name: Enforce min function check
        if: always() && steps.minfunc_check.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            core.setFailed(
              'minfunc failed. Functions with fewer than the minimum lines were found. Run make minfunc locally and remove the trivial wrappers.'
            );

      - name: Register golangci-lint problem matcher
        if: always()
        run: echo "::add-matcher::.github/golangci-lint-matcher.json"

      - name: Lint
        if: always()
        id: lint
        continue-on-error: true
        run: make lint

      - name: Remove golangci-lint problem matcher
        if: always()
        run: echo "::remove-matcher owner=golangci-lint::"

      - name: Enforce lint
        if: always() && steps.lint.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            core.setFailed(
              'golangci-lint failed. See file annotations and the Lint step log for details.'
            );

      - name: Setup Node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install markdownlint-cli2
        if: always()
        run: npm ci

      - name: Lint Markdown (markdownlint-cli2)
        if: always()
        id: lint_md
        continue-on-error: true
        run: make lint-md

      - name: Enforce Markdown lint
        if: always() && steps.lint_md.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            core.setFailed(
              'Markdown lint failed. Run make lint-md locally and fix the reported rule violations.'
            );

      - name: Check docs links (lychee)
        if: always()
        run: |
          # Install lychee from a pinned release for reproducibility and security.
          # Using v0.15.1 as a known good release.
          LYCHEE_VERSION="v0.15.1"
          ASSET="lychee-$(uname -m)-unknown-linux-gnu.tar.gz"
          URL="https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/${ASSET}"
          
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/lychee.tar.gz "${URL}"
          tar -xzf /tmp/lychee.tar.gz -C /tmp
          sudo mv /tmp/lychee-*/lychee /usr/local/bin/lychee
          make lint-links

      - name: Test
        if: always()
        id: test
        continue-on-error: true
        run: make test

      - name: Enforce tests
        if: always() && steps.test.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            core.setFailed(
              'Go tests failed. Open the Test step log for package and assertion details.'
            );

      - name: Comment CI failure on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-go-failure -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body = `${marker}\n## CI (Go) failed\n\n[Workflow run](${runUrl})\n\n`;
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath && fs.existsSync(summaryPath)) {
              body += fs.readFileSync(summaryPath, 'utf8');
            } else {
              body += 'See the failed workflow run for details.';
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
