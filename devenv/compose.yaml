version: "3.8"
name: agentd

# Local development stack for agentd + web UI testing.
#
# Services:
#   mockllm - fake OpenAI-compatible backend (devenv/mockllm)
#   litellm - LLM proxy/router (port 4000)
#   agentd  - daemon (port 8765)
#   web     - Next.js frontend (port 3000)
#
# Usage:
#   make dev-up
#   # Open http://localhost:3000
#
# The stack keeps running until explicitly stopped.
#
# To stop:
#   make dev-down
#
# To rebuild after code changes:
#   make dev-up
#
# Troubleshooting:
#   - Healthchecks use CMD-SHELL (string form) so they survive the alias/quote
#     handling in podman-compose 1.3.0. If a service stays unhealthy, run:
#       podman logs agentd_<service>_<n>
#       podman inspect agentd_<service>_<n> --format '{{json .State.Health}}'
#   - Web runs as root inside the container. Under rootless podman the container
#     uid 0 maps to the host user, so this is safe and keeps host file ownership.
#   - NEXT_PUBLIC_API_URL is localhost:8765 (client-side fetches from the browser,
#     not from inside the container). host.docker.internal is not defined on Linux.
#   - Named volume "agentd_agentd-data" holds /home/agentd (db at /home/agentd/global.db).

services:
  mockllm:
    build:
      context: ./mockllm
      dockerfile: Dockerfile
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/models').status==200 else 1)\""]
      interval: 2s
      timeout: 3s
      retries: 20

  litellm:
    image: docker.io/litellm/litellm:1.100.0
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      # Pre-call hook registered in config.yaml (litellm_settings.callbacks).
      - ./litellm/agentd_correlation.py:/app/agentd_correlation.py:ro
    depends_on:
      mockllm:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness').status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 30

  agentd:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["sh", "-c", "agentd --config /etc/agentd/config.yaml init && exec agentd --config /etc/agentd/config.yaml start --skip-llm-warmup -v"]
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      LITELLM_API_KEY: "sk-demo-litellm-plan-execute-only"
      AGENTD_API_ADDRESS: "0.0.0.0:8765"
    volumes:
      - agentd-data:/home/agentd
      - ./agentd/config.yaml:/etc/agentd/config.yaml:ro
    depends_on:
      litellm:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8765/api/v1/system/status"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    image: node:22-alpine
    user: root
    working_dir: /app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: "development"
      NEXT_PUBLIC_USE_MOCK: "false"
      NEXT_PUBLIC_API_URL: "http://localhost:8765"
    volumes:
      - ../web:/app
    command: ["sh", "-c", "npm install --legacy-peer-deps && npm run dev"]
    depends_on:
      agentd:
        condition: service_started

volumes:
  agentd-data:
