version: "3.8"
name: agentd

# Local development stack for agentd + web UI + e2e test variants.
#
# Services:
#   mockllm - fake OpenAI-compatible backend (devenv/mockllm) - all profiles
#   litellm - LLM proxy/router (port 4000) - all profiles
#   agentd  - daemon (port 8765) - default profile
#   agentd-healing - variant (port 8766) - healing profile
#   agentd-faults  - variant (port 8767) - faults profile
#   agentd-disk    - variant (port 8768) - disk profile
#   agentd-brk     - variant (port 8770) - breaker profile (all providers dead)
#   agentd-tiered  - variant (port 8769) - tiered profile
#   web     - Next.js frontend (port 3000) - default profile
#
# Usage:
#   make dev-up            # Brings up default profile (agentd + web)
#   podman compose -f devenv/compose.yaml up -d agentd-healing  # Brings up healing variant
#   make dev-down          # Stops all services
#
# E2E Tests:
#   make test-e2e          # Runs e2e tests (requires devenv up)
#
# Profiles:
#   default - standard development stack (agentd + web)
#   healing - self-healing and outage handoff (J07)
#   faults  - provider cascade to a live secondary (J09 part A)
#   breaker - every provider dead, so the breaker trips (J09 part B)
#   disk    - disk space watchdog (J10)
#   tiered  - tiered execution (J12)
#
# Troubleshooting:
#   - Healthchecks use CMD-SHELL (string form) so they survive the alias/quote
#     handling in podman-compose 1.3.0. If a service stays unhealthy, run:
#       podman logs agentd_<service>_<n>
#       podman inspect agentd_<service>_<n> --format '{{json .State.Health}}'
#   - Web runs as root inside the container. Under rootless podman the container
#     uid 0 maps to the host user, so this is safe and keeps host file ownership.
#   - NEXT_PUBLIC_API_URL is localhost:8765 (client-side fetches from the browser,
#     not from inside the container). host.docker.internal is not defined on Linux.
#   - Named volumes hold service data (e.g., agentd-data at /home/agentd/global.db).

services:
  mockllm:
    build:
      context: ./mockllm
      dockerfile: Dockerfile
    expose:
      - "8000"
    # Published so the e2e harness can read back what the worker actually sent
    # (GET /requests) without shelling into the container — J11 asserts a saved
    # preference reached the worker's prompt, and nothing in the agentd API
    # exposes prompt contents.
    ports:
      - "127.0.0.1:8000:8000"
    profiles:
      - default
      - healing
      - faults
      - disk
      - tiered
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/models').status==200 else 1)\""]
      interval: 2s
      timeout: 3s
      retries: 20

  litellm:
    image: docker.io/litellm/litellm:1.100.0
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    profiles:
      - default
      - healing
      - faults
      - disk
      - tiered
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      # Pre-call hook registered in config.yaml (litellm_settings.callbacks).
      - ./litellm/agentd_correlation.py:/app/agentd_correlation.py:ro
    depends_on:
      mockllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness').status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 30

  agentd:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["sh", "-c", "agentd --config /etc/agentd/config.yaml init && exec agentd --config /etc/agentd/config.yaml start --skip-llm-warmup -v"]
    ports:
      - "127.0.0.1:8765:8765"
    profiles:
      - default
    environment:
      LITELLM_API_KEY: "sk-demo-litellm-plan-execute-only"
      AGENTD_API_ADDRESS: "0.0.0.0:8765"
    volumes:
      - agentd-data:/home/agentd
      - ./agentd/config.yaml:/etc/agentd/config.yaml:ro
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8765/api/v1/system/status"]
      interval: 3s
      timeout: 3s
      retries: 30

  agentd-healing:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["sh", "-c", "agentd --config /etc/agentd/config.yaml init && exec agentd --config /etc/agentd/config.yaml start --skip-llm-warmup -v"]
    ports:
      - "127.0.0.1:8766:8766"
    profiles:
      - healing
    environment:
      LITELLM_API_KEY: "sk-demo-litellm-plan-execute-only"
      AGENTD_API_ADDRESS: "0.0.0.0:8766"
    volumes:
      - agentd-data-healing:/home/agentd-healing
      - ./agentd/config.healing.yaml:/etc/agentd/config.yaml:ro
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8766/api/v1/system/status"]
      interval: 3s
      timeout: 3s
      retries: 30

  agentd-faults:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["sh", "-c", "agentd --config /etc/agentd/config.yaml init && exec agentd --config /etc/agentd/config.yaml start --skip-llm-warmup -v"]
    ports:
      - "127.0.0.1:8767:8767"
    profiles:
      - faults
    environment:
      LITELLM_API_KEY: "sk-demo-litellm-plan-execute-only"
      AGENTD_API_ADDRESS: "0.0.0.0:8767"
    volumes:
      - agentd-data-faults:/home/agentd-faults
      - ./agentd/config.faults.yaml:/etc/agentd/config.yaml:ro
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8767/api/v1/system/status"]
      interval: 3s
      timeout: 3s
      retries: 30

  agentd-disk:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["sh", "-c", "agentd --config /etc/agentd/config.yaml init && exec agentd --config /etc/agentd/config.yaml start --skip-llm-warmup -v"]
    ports:
      - "127.0.0.1:8768:8768"
    profiles:
      - disk
    environment:
      LITELLM_API_KEY: "sk-demo-litellm-plan-execute-only"
      AGENTD_API_ADDRESS: "0.0.0.0:8768"
      # Points agentd's home at the named volume. Without this, home resolves
      # to $HOME/.agentd in the image layer — `home:` in config.disk.yaml is
      # ignored (pinned by internal/config/config.go's newConfigViper) — and
      # bind-mounting the crontab there makes podman create the parent dirs
      # as root, which the non-root agentd user then cannot write.
      AGENTD_HOME: "/home/agentd-disk"
    volumes:
      - agentd-data-disk:/home/agentd-disk
      - ./agentd/config.disk.yaml:/etc/agentd/config.yaml:ro
      # J10 needs the disk watchdog to run every 5s; the default schedule is
      # */10. The crontab is the only cadence input — there is no
      # disk.check_interval config key — so it has to be bind-mounted to
      # <AGENTD_HOME>/agentd.crontab. `agentd init` leaves it alone
      # (WriteDefaultCron is O_EXCL, so an existing file is preserved).
      - ./agentd/crontab.disk:/home/agentd-disk/agentd.crontab:ro
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8768/api/v1/system/status"]
      interval: 3s
      timeout: 3s
      retries: 30

  agentd-brk:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["sh", "-c", "agentd --config /etc/agentd/config.yaml init && exec agentd --config /etc/agentd/config.yaml start --skip-llm-warmup -v"]
    ports:
      - "127.0.0.1:8770:8770"
    profiles:
      - breaker
    environment:
      LITELLM_API_KEY: "sk-demo-litellm-plan-execute-only"
      AGENTD_API_ADDRESS: "0.0.0.0:8770"
    volumes:
      - agentd-data-brk:/home/agentd-brk
      - ./agentd/config.breaker.yaml:/etc/agentd/config.yaml:ro
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8770/api/v1/system/status"]
      interval: 3s
      timeout: 3s
      retries: 30

  agentd-tiered:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["sh", "-c", "agentd --config /etc/agentd/config.yaml init && exec agentd --config /etc/agentd/config.yaml start --skip-llm-warmup -v"]
    ports:
      - "127.0.0.1:8769:8769"
    profiles:
      - tiered
    environment:
      LITELLM_API_KEY: "sk-demo-litellm-plan-execute-only"
      AGENTD_API_ADDRESS: "0.0.0.0:8769"
    volumes:
      - agentd-data-tiered:/home/agentd-tiered
      - ./agentd/config.tiered.yaml:/etc/agentd/config.yaml:ro
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8769/api/v1/system/status"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    image: node:22-alpine
    user: root
    working_dir: /app
    ports:
      - "127.0.0.1:3000:3000"
    profiles:
      - default
    environment:
      NODE_ENV: "development"
      NEXT_PUBLIC_USE_MOCK: "false"
      NEXT_PUBLIC_API_URL: "http://localhost:8765"
    volumes:
      - ../web:/app
    # npm ci installs exactly what package-lock.json pins and never rewrites
    # it. The plain `npm install` this replaced rewrote the bind-mounted
    # lockfile on every container start (B-002), dirtying the host tree.
    command: ["sh", "-c", "npm ci --legacy-peer-deps && npm run dev"]
    depends_on:
      agentd:
        condition: service_started

volumes:
  agentd-data:
  agentd-data-healing:
  agentd-data-faults:
  agentd-data-disk:
  agentd-data-brk:
  agentd-data-tiered:
