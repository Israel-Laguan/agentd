# agentd configuration for disk profile (J10).
# Tests disk space watchdog.

home: /home/agentd-disk
db_path: /home/agentd-disk/global.db
projects_dir: /home/agentd-disk/projects
uploads_dir: /home/agentd-disk/uploads

api:
  address: "0.0.0.0:8768"

gateway:
  order: [litellm]
  providers:
    - name: litellm
      adapter: openai
      base_url: "http://litellm:4000/v1"
      api_key_env: LITELLM_API_KEY
      model: "agentd"
      capabilities:
        chat_tools: true
      options:
        send_task_metadata: true
  warmup_enabled: false
  role_models:
    chat:  { provider: "", model: "" }
    worker: { provider: "", model: "" }
    memory: { provider: "", model: "" }

queue:
  token_budget: 50000

healing:
  enabled: false
  outage_handoff_enabled: false

# Disk watchdog configuration for J10.
#
# free_threshold_percent: 100 means "alert unless the filesystem is
# literally 100% free", so the watchdog always fires on the container's
# overlay fs. That is the point — J10 tests that the alert is raised once
# and deduped on the next pass, not that a real disk-full condition occurs.
#
# The watchdog's *cadence* is not a config key: it comes from
# <home>/agentd.crontab, bind-mounted from devenv/agentd/crontab.disk with
# an "@every 5s disk-watchdog" entry. An earlier revision of this file set a
# `check_interval: 5s` key here, which no Go config struct reads — it was
# silently ignored and the watchdog stayed on the default */10 schedule.
disk:
  free_threshold_percent: 100
