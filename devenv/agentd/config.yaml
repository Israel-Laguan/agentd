# agentd configuration for the devenv/compose.yaml stack.
#
# The only gateway provider is the litellm proxy running in the same compose
# network. All seeded agent profiles (default/researcher/qa) leave provider and
# model empty, so they cascade to gateway.order -> litellm -> agentd.
#
# Passed to the daemon with: agentd --config /etc/agentd/config.yaml

home: /home/agentd
db_path: /home/agentd/global.db
projects_dir: /home/agentd/projects
uploads_dir: /home/agentd/uploads

api:
  address: "0.0.0.0:8765"
  # source_path seeds must resolve under this root. The default (the user's
  # home) is the agentd home in this image, which is always refused, so the
  # e2e journeys seed from here instead (test/e2e/devenv.go).
  source_root: /tmp/agentd-sources

gateway:
  order: [litellm]
  providers:
    - name: litellm
      adapter: openai
      base_url: "http://litellm:4000/v1"
      api_key_env: LITELLM_API_KEY      # matches the demo key in litellm/config.yaml + compose env
      model: "agentd"
      capabilities:
        chat_tools: true
      options:
        # M18: propagate task_id/agent_id/agent to litellm for spend correlation.
        send_task_metadata: true
  warmup_enabled: false

queue:
  token_budget: 50000
  # J20: the working-zone cut (gateway.truncation.strategy, default head_tail)
  # only shows when this total (10000) is under the agentic character budget
  # (gateway.truncator.max_input_chars, 12000); with the product defaults
  # (60000) the gateway's head-only cut runs first. Only agentic tasks read it.
  agentic_context:
    anchor_budget: 3000
    working_budget: 5000
    compressed_budget: 2000

# Keep the dev stack quiet: no self-healing handoffs or outage tasks.
healing:
  enabled: false
  outage_handoff_enabled: false

# J08 proves the opt-in reset: after an unclean kill, boot reconcile empties the
# start-empty project's workspace so the re-run does not see the first attempt's
# marker file. Off by default in the product.
recovery:
  clean_workspace_on_recover: true

# MCP board tools, enabled so the J15 journey can exercise /mcp. Off by
# default in the product (mcp.enabled defaults to false, transport stdio);
# the HTTP transport rides on api.address above — there is no separate
# listener, so mcp.http_addr is deliberately not set here.
mcp:
  enabled: true
  transport: http

# J17: the events API must scrub this pattern (sandbox.scrub_patterns, B-065).
# It matches only the journey's own token, so no other journey's events change.
sandbox:
  scrub_patterns: ["E2E-SCRUB-[0-9]{6}"]
