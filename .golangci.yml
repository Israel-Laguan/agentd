version: "2"

run:
  timeout: 5m

linters:
  settings:
    cyclop:
      max-complexity: 15
    funlen:
      lines: 60
      statements: 40
    revive:
      rules:
        - name: function-length
          arguments: [100, 60]
    depguard:
      rules:
        no-outward-model-deps:
          files:
            - "**/internal/models/*.go"
          deny:
            - pkg: "agentd/internal/api"
              desc: "models layer must stay inward and not depend on api"
            - pkg: "agentd/internal/frontdesk"
              desc: "models layer must stay inward and not depend on frontdesk"
            - pkg: "agentd/internal/kanban"
              desc: "models layer must stay inward and not depend on persistence"
            - pkg: "agentd/internal/config"
              desc: "models layer must stay inward and not depend on config"
            - pkg: "agentd/internal/bus"
              desc: "models layer must stay inward and not depend on bus"
            - pkg: "agentd/internal/memory"
              desc: "models layer must stay inward and not depend on memory"
            - pkg: "agentd/internal/gateway"
              desc: "models layer must stay inward and not depend on gateway"
            - pkg: "agentd/internal/queue"
              desc: "models layer must stay inward and not depend on queue"
            - pkg: "agentd/internal/sandbox"
              desc: "models layer must stay inward and not depend on sandbox"
        # The gateway is the first agent-kit cut (T-045): its non-test code may
        # import only the standard library, itself and the kit's leaves.
        gateway-boundary:
          list-mode: strict
          files:
            - "**/internal/gateway/**"
            - "!$test"
          allow:
            - $gostd
            # Exact roots and slash subtrees: a bare prefix would also admit
            # siblings such as internal/gatewayextra.
            - agentd/internal/gateway$
            - agentd/internal/gateway/
            - agentd/agentkit$
            - agentd/agentkit/
        # The kit must never reach back into agentd (T-045, SP-024).
        agentkit-boundary:
          list-mode: strict
          files:
            - "**/agentkit/**"
            - "!$test"
          allow:
            - $gostd
            - agentd/agentkit$
            - agentd/agentkit/
        # The harness can only leave once the core imports none of it (T-066,
        # docs/harness-extraction.md). Test files included. queue/worker joins
        # the core in T-070.
        core-no-harness:
          files:
            - "**/cmd/**"
            - "**/internal/mcp/**"
            - "**/internal/agent/hooks/**"
            - "**/internal/agent/acp/**"
            - "**/internal/api/**"
            - "**/internal/bus/**"
            - "**/internal/config/**"
            - "**/internal/frontdesk/**"
            - "**/internal/kanban/**"
            - "**/internal/memory/**"
            - "**/internal/models/**"
            - "**/internal/sandbox/**"
            - "**/internal/services/**"
            - "**/internal/stage/**"
            - "**/internal/aicalls/**"
            - "**/internal/paths/**"
            - "**/internal/queue/*.go"
            - "**/internal/queue/runaudit/**"
          # Exact roots and slash subtrees, so a sibling such as
          # agent/toolsextra is not caught.
          deny:
            - pkg: "agentd/internal/queue/worker/agentic$"
              desc: "the builtin agent loop is harness; the core must not import it"
            - pkg: "agentd/internal/queue/worker/agentic/"
              desc: "the builtin agent loop is harness; the core must not import it"
            - pkg: "agentd/internal/agent/runtime$"
              desc: "agent/runtime is harness; the core must not import it"
            - pkg: "agentd/internal/agent/runtime/"
              desc: "agent/runtime is harness; the core must not import it"
            - pkg: "agentd/internal/agent/tools$"
              desc: "agent/tools is harness; the core must not import it"
            - pkg: "agentd/internal/agent/tools/"
              desc: "agent/tools is harness; the core must not import it"
            - pkg: "agentd/internal/agent/session$"
              desc: "agent/session is harness; the core must not import it"
            - pkg: "agentd/internal/agent/session/"
              desc: "agent/session is harness; the core must not import it"
            - pkg: "agentd/internal/agent/context$"
              desc: "agent/context is harness; the core must not import it"
            - pkg: "agentd/internal/agent/context/"
              desc: "agent/context is harness; the core must not import it"
            - pkg: "agentd/internal/agent/filecontext$"
              desc: "agent/filecontext is harness; the core must not import it"
            - pkg: "agentd/internal/agent/filecontext/"
              desc: "agent/filecontext is harness; the core must not import it"
            - pkg: "agentd/internal/agent/subagent$"
              desc: "agent/subagent is harness; the core must not import it"
            - pkg: "agentd/internal/agent/subagent/"
              desc: "agent/subagent is harness; the core must not import it"
            - pkg: "agentd/internal/capabilities$"
              desc: "capabilities is harness; the core must not import it"
            - pkg: "agentd/internal/capabilities/"
              desc: "capabilities is harness; the core must not import it"
        queue-test-isolation:
          files:
            - "**/internal/queue/**_test.go"
          deny:
            - pkg: "agentd/internal/kanban"
              desc: "use testutil.FakeKanbanStore instead of real kanban in queue tests"
            - pkg: "agentd/internal/memory"
              desc: "memory integration tests should use //go:build integration"
        sandbox-test-isolation:
          files:
            - "**/internal/sandbox/**_test.go"
          deny:
            - pkg: "agentd/internal/kanban"
              desc: "sandbox tests should not depend on the board"
            - pkg: "agentd/internal/queue"
              desc: "sandbox tests should not depend on queue"
        gateway-test-isolation:
          files:
            - "**/internal/gateway/**_test.go"
          deny:
            - pkg: "agentd/internal/kanban"
              desc: "gateway tests should not depend on the board"
            - pkg: "agentd/internal/queue"
              desc: "gateway tests should not depend on queue"
            - pkg: "agentd/internal/sandbox"
              desc: "gateway tests should not depend on sandbox"
        kanban-test-isolation:
          files:
            - "**/internal/kanban/**_test.go"
          deny:
            - pkg: "agentd/internal/queue"
              desc: "kanban tests should not depend on queue"
            - pkg: "agentd/internal/gateway"
              desc: "kanban tests should not depend on gateway"
            - pkg: "agentd/internal/sandbox"
              desc: "kanban tests should not depend on sandbox"
            - pkg: "agentd/internal/api"
              desc: "kanban tests should not depend on api"
  enable:
    - errcheck
    - cyclop
    - revive
    - govet
    - funlen
    - depguard
  exclusions:
    paths:
      - web/node_modules